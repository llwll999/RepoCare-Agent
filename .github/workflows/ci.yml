name: RepoCare CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff fastapi uvicorn sqlmodel httpx "mcp[cli]"

      - name: Check code style
        run: python -m ruff check src tests

      - name: Run quality-gate tests
        run: >-
          python -m pytest
          tests/test_state.py
          tests/test_api.py
          tests/test_repository.py
          tests/test_tools.py
          tests/test_memory.py
          tests/test_planner.py
          tests/test_reviewer.py
          tests/test_mcp_server.py
          tests/test_evaluation_dataset.py
          -q

      # tests/test_export_service.py intentionally reproduces the known
      # duplicate-score defect. Do not include it in the green CI gate until
      # its implementation is repaired in a dedicated change.
